services:
  - type: web
    name: campusforge
    env: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && cd frontend && npm install && npm run build && cd .."
    startCommand: "python backend/seed.py && uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATABASE_URL
        sync: false        # Set this manually in Render dashboard → your Supabase URI
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false        # Optional — leave blank if not using AI features
